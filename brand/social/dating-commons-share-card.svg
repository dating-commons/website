<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Dating Commons share card</title>
  <desc id="desc">Share card for the foundation umbrella of The Dating Commons.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE3"/>
      <stop offset="100%" stop-color="#ECDDCA"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="151" cy="120" r="130" fill="#E0C4AA" opacity="0.55"/>
  <circle cx="1445" cy="748" r="170" fill="#B84D33" opacity="0.12"/>
  <g opacity="0.08">
    <path d="M0 70H1600M0 140H1600M0 210H1600M0 280H1600M0 350H1600M0 420H1600M0 490H1600M0 560H1600M0 630H1600M0 700H1600M0 770H1600" stroke="#1D1813"/>
    <path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900M1200 0V900M1320 0V900M1440 0V900" stroke="#1D1813"/>
  </g>
  <text x="126" y="108" fill="#B84D33" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">THE DATING COMMONS</text>
  <text x="124" y="238" fill="#1D1813" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="94">Connection is a commons,</text>
  <text x="124" y="326" fill="#1D1813" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="94">not a premium feature.</text>
  <text x="126" y="438" fill="#665948" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="34">Foundation umbrella for The Dating Institute, HeartFull,</text>
  <text x="126" y="484" fill="#665948" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="34">and the Offline Dating Movement.</text>
  <g transform="translate(132 602)">
    <rect width="320" height="74" rx="37" fill="#1D1813"/>
    <text x="160" y="45" text-anchor="middle" fill="#FFFAF3" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">datingcommons.org</text>
  </g>
  <g transform="translate(1038 136) scale(0.62)">
    <path d="M394 222C277 294 236 718 410 802" fill="none" stroke="#B84D33" stroke-linecap="round" stroke-width="52"/>
    <path d="M630 222C747 294 788 718 614 802" fill="none" stroke="#1D1813" stroke-linecap="round" stroke-width="52"/>
    <path d="M468 344C430 404 420 620 470 680" fill="none" stroke="#D9B38C" stroke-linecap="round" stroke-width="30"/>
    <path d="M556 344C594 404 604 620 554 680" fill="none" stroke="#D9B38C" stroke-linecap="round" stroke-width="30"/>
    <rect x="444" y="418" width="136" height="188" rx="68" fill="#FFFAF3" stroke="#1D1813" stroke-width="18"/>
    <circle cx="512" cy="512" r="31" fill="#B84D33"/>
  </g>
</svg>
